<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Test - Video Debug</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Portfolio Data Test</h1>
    <pre id="portfolio-data"></pre>
    
    <h2>Portfolio Grid Preview</h2>
    <div id="portfolio-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;"></div>

    <script>
        // Load and display portfolio data
        fetch('portfolio.json', { cache: 'no-cache' })
            .then(response => response.json())
            .then(data => {
                console.log('Portfolio data loaded:', data);
                document.getElementById('portfolio-data').textContent = JSON.stringify(data, null, 2);
                
                // Show first item details
                if (data.items && data.items.length > 0) {
                    const firstItem = data.items[0];
                    console.log('First item:', firstItem);
                    
                    const container = document.getElementById('portfolio-grid');
                    
                    // Render first item
                    if (firstItem.isVideo && firstItem.videoUrl) {
                        container.innerHTML = `
                            <div style="border: 2px solid green; padding: 10px;">
                                <h3>${firstItem.title}</h3>
                                <video width="300" height="200" controls>
                                    <source src="${firstItem.videoUrl}" type="video/mp4">
                                </video>
                                <p>${firstItem.description}</p>
                            </div>
                        `;
                    } else {
                        container.innerHTML = `<p>First item is not a video: ${JSON.stringify(firstItem)}</p>`;
                    }
                }
            })
            .catch(error => {
                console.error('Error loading portfolio:', error);
                document.getElementById('portfolio-data').textContent = 'Error: ' + error.message;
            });
    </script>
    
    <!-- Floating contact widget (WhatsApp + Call) -->

        <ul class="contact-actions" role="list">
            <li>
                <a href="https://wa.me/919003032732?text=Hello%20Sam%27s%20Interiors"
                    class="contact-btn contact-whatsapp" aria-label="Chat on WhatsApp" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none">
                        <path d="M12.045 0C5.431 0 0 5.431 0 12.045c0 2.126.663 4.111 1.804 5.818L0 24l6.305-1.652c1.641.451 3.371.697 5.14.697 6.614 0 12.045-5.431 12.045-12.045C23.49 5.431 18.059 0 12.045 0zm0 21.75c-1.577 0-3.12-.426-4.476-1.23l-.32-.19-3.33.873.872-3.25-.205-.338a10.95 10.95 0 01-1.38-5.76c0-6.06 4.93-11 11-11s11 4.94 11 11-4.93 11-11 11z" fill="#25D366" />
                        <path d="M10 8.5c-.3 0-.5.2-.5.5v7c0 .3.2.5.5.5h4c.3 0 .5-.2.5-.5V9c0-.3-.2-.5-.5-.5h-4zm.5 1h3v6h-3v-6z" fill="#fff" />
                        <path d="M9.5 7.5c0-.3.2-.5.5-.5h4c.3 0 .5.2.5.5v1c0 .3-.2.5-.5.5h-4c-.3 0-.5-.2-.5-.5v-1z" fill="#fff" />
                        <path d="M9.5 15.5c0 .3.2.5.5.5h4c.3 0 .5-.2.5-.5v-1c0-.3-.2-.5-.5-.5h-4c-.3 0-.5.2-.5.5v1z" fill="#fff" />
                    </svg>
                </a>
            </li>
            <li>
                <a href="tel:+919003032732" class="contact-btn contact-call" aria-label="Call Sam's Interiors">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none">
                        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="#2EA6FF" />

    </div>

    <script src="js/main.js" defer></script>
</body>
</html>
