<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Test - Video Debug</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Portfolio Data Test</h1>
    <pre id="portfolio-data"></pre>
    
    <h2>Portfolio Grid Preview</h2>
    <div id="portfolio-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;"></div>

    <script>
        // Load and display portfolio data
        fetch('portfolio.json', { cache: 'no-cache' })
            .then(response => response.json())
            .then(data => {
                console.log('Portfolio data loaded:', data);
                document.getElementById('portfolio-data').textContent = JSON.stringify(data, null, 2);
                
                // Show first item details
                if (data.items && data.items.length > 0) {
                    const firstItem = data.items[0];
                    console.log('First item:', firstItem);
                    
                    const container = document.getElementById('portfolio-grid');
                    
                    // Render first item
                    if (firstItem.isVideo && firstItem.videoUrl) {
                        container.innerHTML = `
                            <div style="border: 2px solid green; padding: 10px;">
                                <h3>${firstItem.title}</h3>
                                <video width="300" height="200" controls>
                                    <source src="${firstItem.videoUrl}" type="video/mp4">
                                </video>
                                <p>${firstItem.description}</p>
                            </div>
                        `;
                    } else {
                        container.innerHTML = `<p>First item is not a video: ${JSON.stringify(firstItem)}</p>`;
                    }
                }
            })
            .catch(error => {
                console.error('Error loading portfolio:', error);
                document.getElementById('portfolio-data').textContent = 'Error: ' + error.message;
            });
    </script>
</body>
</html>
